<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1584px; height:396px; overflow:hidden;
    background:#100D18;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .banner {
    position:relative; width:1584px; height:396px;
    background:
      radial-gradient(circle at 78% 20%, rgba(196,166,251,0.30), transparent 45%),
      radial-gradient(circle at 92% 85%, rgba(237,228,255,0.16), transparent 45%),
      radial-gradient(circle at 55% 90%, rgba(155,126,222,0.22), transparent 50%),
      #100D18;
    overflow:hidden;
  }

  /* meteor streaks - static, decorative */
  .streak {
    position:absolute; height:2px; border-radius:2px;
    background:linear-gradient(90deg, transparent, rgba(196,166,251,0.9));
    transform-origin:right center;
  }
  .streak.s1 { width:180px; top:70px; left:900px; transform:rotate(18deg); background:linear-gradient(90deg, transparent, rgba(196,166,251,0.85)); }
  .streak.s2 { width:120px; top:150px; left:1180px; transform:rotate(18deg); background:linear-gradient(90deg, transparent, rgba(237,228,255,0.7)); }
  .streak.s3 { width:150px; top:280px; left:1020px; transform:rotate(18deg); background:linear-gradient(90deg, transparent, rgba(155,126,222,0.75)); }
  .spark { position:absolute; width:4px; height:4px; border-radius:50%; background:#EDE4FF; box-shadow:0 0 8px 2px rgba(237,228,255,0.7); }

  /* left ~340px kept clear for the circular profile photo LinkedIn overlays */
  .content {
    position:absolute; left:540px; top:95px; right:56px; bottom:95px;
    display:flex; flex-direction:column; justify-content:center;
  }

  .name {
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:68px;
    line-height:0.95;
    letter-spacing:-0.01em;
    background:linear-gradient(100deg, #FFFFFF 35%, #A78BFA 75%, #C4A6FB);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:12px;
  }

  .tagline {
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:500;
    font-size:21px;
    color:#E7DFF7;
    margin-bottom:18px;
  }
  .tagline b { color:#C4A6FB; font-weight:600; }

  .stack {
    display:flex; gap:9px; margin-bottom:20px; flex-wrap:wrap;
  }
  .pill {
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:#EDE4FF;
    border:1px solid rgba(237,228,255,0.35);
    background:rgba(255,255,255,0.06);
    padding:5px 13px;
    border-radius:20px;
  }

  .contact-row {
    display:flex; gap:24px; align-items:center;
  }
  .contact-row span {
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    color:#B9AACF;
  }
  .contact-row .dot { color:#9E90B8; }

  .signature {
    position:absolute; right:56px; bottom:32px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    color:#9E90B8;
    letter-spacing:0.02em;
  }
  .signature b { color:#C4A6FB; }
</style>
</head>
<body>
  <div class="banner">
    <div class="streak s1"></div>
    <div class="streak s2"></div>
    <div class="streak s3"></div>
    <div class="spark" style="top:68px; left:1080px;"></div>
    <div class="spark" style="top:148px; left:1300px;"></div>
    <div class="spark" style="top:278px; left:1170px;"></div>

    <div class="content">
      <div class="name">Madhumitha<br>Challa</div>
      <div class="tagline"><b>Cloud &amp; Systems Engineering</b> · Data · IT Support</div>
      <div class="stack">
        <div class="pill">AWS</div>
        <div class="pill">Azure</div>
        <div class="pill">Oracle Cloud HCM</div>
        <div class="pill">Microsoft 365</div>
        <div class="pill">Python</div>
      </div>
      <div class="contact-row">
        <span>rchmadhumitha@gmail.com</span>
        <span class="dot">·</span>
        <span>linkedin.com/in/madhumitha-challa</span>
        <span class="dot">·</span>
        <span>github.com/MadhumithaChalla</span>
      </div>
    </div>

    <div class="signature">aka <b>Female Photon</b> ✦ writing &amp; singing</div>
  </div>
</body>
</html>
