const AT_MAP={id:"Role ID",company:"Company",title:"Role Title",location:"Location",salary:"Salary",closing:"Closing Date",priority:"Priority",tier:"Tier",status:"Status",source:"Source",url:"Apply URL",appliedAt:"Applied Date",pinned:"Pinned",note:"Notes",portalCategory:"Portal Category",employerType:"Employer Type","function":"Function",level:"Level"};

 const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:rgba(10,12,16,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px";

function atDisconnectLink(){const a=document.createElement("button");a.className="ghost sm";a.textContent="Disconnect this browser";a.style.cssText="position:fixed;left:12px;bottom:12px;z-index:5";a.onclick=()=>{try{localStorage.removeItem("jd-airtable")}catch(e){}location.reload()};document.body.appendChild(a)}
function makeAirtableDb(cfg){
 const base="https://api.airtable.com/v0/"+cfg.base+"/"+cfg.table,H={authorization:"Bearer "+cfg.token,"content-type":"application/json"};
 const air=async(path,init)=>{const r=await fetch(base+path,Object.assign({headers:H},init));if(r.status===401||r.status===403){toast("Airtable refused the token. Disconnect and reconnect.");throw new Error("auth")}if(!r.ok)throw new Error("HTTP "+r.status);return r.json()};
 const fromAt=rec=>{const o={_rec:rec.id};for(const k in AT_MAP){if(rec.fields[AT_MAP[k]]!==undefined)o[k]=rec.fields[AT_MAP[k]]}o.pinned=!!rec.fields["Pinned"];return o};
 const toAt=fs=>{const out={};for(const k in fs){if(!AT_WRITE.includes(k))continue;const v=fs[k];
  if(k==="status"&&!AT_STATUS.includes(v))throw new Error("bad status");
  if(k==="url"&&v&&!/^https:\/\/[^\s<>"']+$/.test(v))throw new Error("bad url");
  if((k==="closing"||k==="appliedAt")&&v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))throw new Error("bad date");
  if((v===""||v===null)&&k!=="pinned")continue;out[AT_MAP[k]]=typeof v==="string"?v.slice(0,2000):v}return out};
 const find=async id=>{const q=encodeURIComponent('{Role ID}="'+String(id).replace(/[^A-Za-z0-9_-]/g,"")+'"');const d=await air("?maxRecords=1&filterByFormula="+q);return d.records[0]};
 const listeners=[];let timer=null;
 async function pull(){try{const rows=[];let off="";do{const d=await air("?pageSize=100"+(off?"&offset="+off:""));rows.push(...d.records.map(fromAt));off=d.offset||""}while(off);
  const snap={docs:rows.map(d=>({id:d.id,data:()=>d}))};listeners.forEach(f=>f(snap))}catch(e){}}
 return{
  collection(name){if(name!=="applications")return{onSnapshot(){}};return{onSnapshot(cb){listeners.push(cb);pull();if(!timer)timer=setInterval(pull,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()})}}},
  doc(path){
   if(path==="prefs/main")return{set:async v=>{lsSet("jd-prefs",v)},onSnapshot(){}};
   if(!path.startsWith("applications/"))return{set:async()=>{},update:async()=>{},onSnapshot(){}};
   const id=path.split("/")[1];
   return{
    update:async o=>{const rec=await find(id);if(!rec)throw new Error("not found");await air("",{method:"PATCH",body:JSON.stringify({records:[{id:rec.id,fields:toAt(o)}],typecast:true})});await pull()},
    set:async o=>{const f=toAt(o);f["Role ID"]=id;const rec=await find(id);
      if(rec)await air("",{method:"PATCH",body:JSON.stringify({records:[{id:rec.id,fields:f}],typecast:true})});
      else await air("",{method:"POST",body:JSON.stringify({records:[{fields:f}],typecast:true})});await pull()}
   };
  }
 };
}

const OFFICIAL=[["Work conditions for your visa (Home Affairs)","https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/student-500","Official student visa page. Read the work conditions for your visa here.","checked"],["Check your own visa conditions (VEVO)","https://immi.homeaffairs.gov.au/visas/already-have-a-visa/check-visa-details-and-conditions/check-conditions-online","Shows the exact work limits on your visa. Address not yet checked.","unchecked"],["Working rights and obligations as a visa holder (my.gov.au)","https://my.gov.au/en/services/living-arrangements/coming-to-australia/coming-to-australia-to-work/working-rights-and-obligations-as-a-visa-holder","Government summary of what you may do (found in search).","search"],["Work rights and the Fair Work Ombudsman (Study Australia)","https://www.studyaustralia.gov.au/en_in/work-in-australia/work-rights-and-responsibilities/roles-of-the-fair-work-ombudsman","Pay, rights and where to get help (found in search).","search"],["Fair Work Ombudsman: visa holders and migrants","https://www.fairwork.gov.au/find-help-for/visa-holders-migrants","Minimum pay and rights apply to everyone who works here. Address not yet checked.","unchecked"],["APS Jobs","https://www.apsjobs.gov.au","Federal government roles. Many need citizenship; read each eligibility line.","unchecked"]];
function whereToApply(p){const v=p.visa,out=[];
 const add=(h,t)=>out.push([h,t]);
 if(v==="citizen"){add("Federal and defence","APS Jobs and graduate programs that need citizenship are open to you. Roles needing a security clearance usually require citizenship.");add("Everything else","Use the job boards, graduate platforms and employer sites freely.")}
 else if(v==="pr"){add("Open to you","Most private, state government and university roles. Many federal and defence roles still need citizenship, so read the eligibility line before you apply.");add("Graduate programs","Filter on Prosple or GradConnection for programs open to permanent residents.")}
 else if(v==="nz"){add("Open to you","Most private and state roles. Many federal roles need citizenship; check each ad.")}
 else if(v==="485"){add("Full work rights, time limited","You can work full time. Say your visa end date honestly if asked. Skip roles that require citizenship or permanent residency, and ask recruiters whether they sponsor.");add("Where to focus","Employer career sites, job boards, and graduate programs that list Temporary Graduate visa holders as eligible.")}
 else if(v==="student"){add("Work limit","Student visa work is capped per fortnight during study periods (check your own limit on VEVO or your visa grant letter). Full-time hours during an official course break are usually allowed, so confirm before you accept a start date.");add("Where to focus","Casual and part-time roles, university jobs, internships and graduate programs open to student visa holders. Check start dates that fall before you finish study.");add("Skip","Roles that need citizenship, permanent residency or a security clearance.")}
 else if(v==="whv"){add("Work limits","Working holiday visas often limit how long you can work for one employer. Check your visa conditions.");add("Where to focus","Casual and fixed-term roles on job boards.")}
 else if(v==="workvisa"){add("Tied to a sponsor","Work rights may depend on one employer or occupation. Check your conditions before you apply anywhere else.")}
 else{add("First step","Check your visa conditions on VEVO or your grant letter before you apply for anything.")}
 return out}

 ${resumeBlock(pr)}

 ${stageAdvice()}${DISCH()}
 <p class="foot">Guidance only. Rules change, so the official site always wins. © 2026 Madhumitha Challa. All rights reserved.</p>`;

 final:{apply:["Graduate programs. Many open months before the start date and close early, so check each closing date","Internships and entry-level roles starting around your finish date","Casual or part-time roles while you wait for outcomes"],avoid:["Roles with start dates that clash with your visa work limits or exams","Programs that need citizenship, permanent residency or a security clearance if you do not hold them"]},
 graduated:{apply:["Graduate programs if you are within the window the ad allows (many state a number of months since graduation)","Entry-level and junior roles in your field","Contract and temporary roles to build a recent record"],avoid:["Internships that are limited to current students","Programs whose graduation window you have already passed"]}};
const FAQ=[["What does the ATS score mean?","It is a simple, transparent check of your resume text: contact details, standard sections, length, dates, bullet points, numbers and action verbs. It is a guide to how easily a system can read your resume. It is not a prediction of whether you will be hired."],["How is the job match score worked out?","The tool looks for skills and keywords from the job description in your resume and shows what matched and what is missing. Only add a missing skill if you really have it."],["What about the organisation values score?","Paste the employer's published values. The tool counts how many of their key words appear in your resume. Use it as a prompt to think about examples that show those values, not as a pass or fail."],["Is my resume stored?","No. The resume text stays in this page while you use it. If you save your profile, only the details you confirm (such as course and year) are saved to your private space."],["Can I apply for a graduate program in first year?","Usually no. Many graduate programs are for final-year students or recent graduates. Internships, vacation programs, part-time and casual roles suit earlier years. Always read the eligibility line on the ad."],["How many hours can I work on a student visa?","Your own visa has the exact conditions. Check them on the official Home Affairs and VEVO pages linked in My profile. This tool does not give migration advice."],["Does the tool apply for jobs for me?","Not without your approval. Applications that need your sign-in, identity answers or visa answers stay with you."],["Can I use my own AI?","Yes. Use the Share buttons on a role, or the prompts below, to open ChatGPT or Claude with the details. Only what you choose to share leaves this page."],["Who owns this?","Madhumitha Challa. All rights reserved."]];
const DISCH=()=>`<div class="note" role="note"><b>Please read.</b> ${esc(DISC)}</div>`;
const ownAI=(a)=>`Role: ${a.title} at ${a.company}${a.location?" ("+a.location+")":""}\nCloses: ${a.closing||"not listed"}\nLink: ${a.url||"not available"}\n\nPlease research this role and company for me. Give the main duties, what the employer values and likely interview topics. Cite your sources and tell me what to check on the ad itself.`;
let shareOpen=null;
function shareHtml(a){return shareOpen===a.id?`<div class="bar" style="margin:6px 0 0"><button class="ghost sm" data-shc="${esc(a.id)}">Copy</button>${navigator.share?`<button class="ghost sm" data-shn="${esc(a.id)}">Share</button>`:""}<a class="ghost sm lnk" target="_blank" rel="noopener noreferrer" href="https://chatgpt.com/?q=${encodeURIComponent(ownAI(a))}">ChatGPT</a><a class="ghost sm lnk" target="_blank" rel="noopener noreferrer" href="https://claude.ai/new?q=${encodeURIComponent(ownAI(a))}">Claude</a></div><small style="color:var(--muted)">Shares only the role details.</small>`:`<button class="ghost sm" data-sh="${esc(a.id)}">Share to my AI</button>`}
function stageAdvice(){const pr=prefs.profile||{};const t=((pr.stage||"")+" "+(pr.year||"")).toLowerCase();let st=/first|1st|second|2nd|early/.test(t)?"early":/third|3rd|penult/.test(t)?"penultimate":/final|last/.test(t)?"final":/graduat|working/.test(t)?"graduated":stageFromYear(pr.grad);const adv=ADVICE[st];
 return adv?`<h3 style="font:600 18px var(--display);margin:18px 0 6px">Positions to consider at your stage</h3><div class="note"><b>Good fits</b><ul>${adv.apply.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><b>Think twice about</b><ul>${adv.avoid.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><small>Check against <a href="https://au.prosple.com" target="_blank" rel="noopener noreferrer">Prosple</a>, <a href="https://au.gradconnection.com" target="_blank" rel="noopener noreferrer">GradConnection</a>, your university careers service and the ad itself. This is a general pattern, not a rule from those sites.</small></div>`:'<div class="note">Add your stage (for example "final year") or expected graduation year above to see suggested positions.</div>'}
function assistantExtra(){const sum=apps.filter(a=>!["Applied","Skipped","Rejected","Closed","Missed"].includes(a.status)).slice(0,40).map(a=>`${a.id} ${a.company}, ${a.title}, ${a.status}, closes ${a.closing||"not listed"}`).join("\n");const pr="Here are my open job applications (no personal details):\n"+sum+"\n\nHelp me plan this week. Cite sources for anything you research and tell me what to check myself.";
 return `<h3 style="font:600 18px var(--display);margin:18px 0 6px">Frequently asked questions</h3>${FAQ.map(f=>`<details class="note" style="margin-bottom:6px"><summary><b>${esc(f[0])}</b></summary><p style="margin:6px 0 0">${esc(f[1])}</p></details>`).join("")}
 <h3 style="font:600 18px var(--display);margin:18px 0 6px">Use my own AI and research</h3><p class="sub">Open your own AI with a ready prompt. Only the text shown is sent. Ask it to cite sources, then check them yourself.</p>
 <div class="bar"><button class="ghost" id="aic" data-p="${esc(pr)}">Copy my open roles prompt</button><a class="ghost lnk" target="_blank" rel="noopener noreferrer" href="https://chatgpt.com/?q=${encodeURIComponent(pr)}">Open in ChatGPT</a><a class="ghost lnk" target="_blank" rel="noopener noreferrer" href="https://claude.ai/new?q=${encodeURIComponent(pr)}">Open in Claude</a></div>
 <div class="bar"><input id="rtopic" style="flex:1" placeholder="Research a topic, e.g. graduate programs open to student visa holders"><button class="ghost" id="rcp">Copy research prompt</button></div>${DISCH()}`}
function bindAssistantExtra(){const c=$("#aic");if(!c)return;const cp=t=>{navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>toast("Could not copy")):toast("Could not copy")};c.onclick=()=>cp(c.dataset.p);$("#rcp").onclick=()=>{const t=$("#rtopic").value.trim();if(!t)return toast("Type a topic first");cp("Research this for me as an Australian job seeker: "+t+". Use official and reputable sources, cite each with a link, say when sources disagree or are out of date, and list what I should confirm myself. This is for information, not legal or migration advice.")}}
let ck={jd:"",org:"",values:"",res:null,busy:false};
function ring(n,l){const c=n==null?"var(--muted)":n>=75?"var(--good)":n>=50?"var(--warn)":"var(--bad)";return `<div class="stat"><b style="color:${c}">${n==null?"n/a":n}</b><span>${l}</span></div>`}
function check(){const pr=prefs.profile||{},rt=(pr.resume||{}).text||"",r=ck.res;
 $("#main").innerHTML=`<h2>Resume check</h2><p class="sub">Three scores for one role: how readable your resume is to applicant tracking software, how well your skills match the advertisement, and how well you match the employer's stated values. These are estimates to help you improve. They are not what any employer's software will actually give you.</p>
 ${rt?"":'<div class="note">Add your resume first in My profile &amp; work rights.</div>'}
 <div class="fm"><label>Employer<input id="co" value="${esc(ck.org)}" placeholder="e.g. Melbourne Polytechnic"></label><label>Or pick a tracked role<select id="cr"><option value="">None</option>${apps.map(a=>`<option value="${esc(a.company)}">${esc(a.id+" "+a.company+" "+a.title)}</option>`).join("")}</select></label></div>
 <label style="display:block;font-size:13px;color:var(--muted)">Paste the job advertisement<textarea id="cj" rows="7" style="width:100%">${esc(ck.jd)}</textarea></label>
 <label style="display:block;font-size:13px;color:var(--muted);margin-top:8px">Paste the employer's values or "About us" text (optional, from their careers page)<textarea id="cv" rows="3" style="width:100%">${esc(ck.values)}</textarea></label>
 <div class="bar" style="margin-top:8px"><button class="btn" id="crun" ${ck.busy?"disabled":""}>${ck.busy?"Checking...":"Check my resume"}</button></div>
 ${r?`<div class="stats">${ring(r.ats.score,"ATS readability")}${ring(r.skills.score,"Skills match")}${ring(r.values?r.values.score:null,"Values match")}</div>
 <h3 style="font:600 18px var(--display);margin:8px 0">Eligibility and fit</h3>${r.elig.map(e=>`<div class="note" style="border-color:var(--${e[0]==="stop"?"bad":e[0]==="check"?"warn":"good"})"><b>${e[0]==="stop"?"Not recommended":e[0]==="check"?"Check before applying":"No concern found"}.</b> ${esc(e[1])}</div>`).join("")}
 <h3 style="font:600 18px var(--display);margin:14px 0 6px">ATS readability: ${r.ats.score}/100</h3><div class="tw"><table class="t2"><thead><tr><th>Check</th><th>Score</th><th>To improve</th></tr></thead><tbody>${r.ats.items.map(i=>`<tr><td>${esc(i.label)}</td><td>${i.got}/${i.max}</td><td>${i.got<i.max?esc(i.tip):'<small style="color:var(--good)">Good</small>'}</td></tr>`).join("")}</tbody></table></div>
 <h3 style="font:600 18px var(--display);margin:14px 0 6px">Skills match: ${r.skills.score==null?"no skills found in the advertisement":r.skills.score+"/100"}</h3>${r.skills.rows.length?`<div class="chips">${r.skills.rows.map(x=>`<span class="pill ${x.ok?"s-Applied":"s-Missed"}">${x.ok?"✓ ":"✗ "}${esc(x.s)}</span>`).join("")}</div><p class="sub" style="margin-top:6px">Add a missing skill only if you genuinely have it.</p>`:""}
 ${r.values?`<h3 style="font:600 18px var(--display);margin:14px 0 6px">Values match: ${r.values.score}/100</h3>${(r.values.matched||[]).map(m=>`<div class="note"><b>${esc(m.value)}.</b> ${esc(m.evidence)}</div>`).join("")}${(r.values.gaps||[]).length?`<p class="sub"><b>Not shown in your resume:</b> ${r.values.gaps.map(esc).join(", ")}</p>`:""}<p class="foot">Values evidence is taken only from your resume text. It is a judgement, so read it critically.</p>`:r.valuesNote?`<p class="sub">${esc(r.valuesNote)}</p>`:""}`:""}
 <h3 style="font:600 18px var(--display);margin:18px 0 6px">Dos and don'ts</h3><div class="grid"><div class="card"><h3>Do</h3>${DOS.map(x=>`<small>✓ ${esc(x)}</small>`).join("")}</div><div class="card"><h3>Please avoid</h3>${DONTS.map(x=>`<small>✗ ${esc(x)}</small>`).join("")}</div></div>
 ${DISCH()}
 <p class="foot">General guidance, not legal or migration advice. © 2026 Madhumitha Challa. All rights reserved.</p>`;
 $("#cr").onchange=e=>{if(e.target.value){ck.org=e.target.value;$("#co").value=e.target.value}};
 $("#crun").onclick=async()=>{ck.org=$("#co").value.trim();ck.jd=$("#cj").value;ck.values=$("#cv").value;if(!rt)return toast("Add your resume in your profile first");if(ck.jd.trim().length<150)return toast("Paste the full advertisement");
  ck.busy=true;check();const sm=await getSample();let skills=null,meta={},valuesNote="",values=null;
  if(sm){try{const j=await sm.json('From this job advertisement return JSON {"skills":string[] (the specific skills, tools and qualifications asked for, at most 25, short names)}. Use only what the text states.\n\nADVERT:\n'+ck.jd.slice(0,12000),{cache:false,modelTier:"quick"});skills=(j.skills||[]).map(String).slice(0,25)}catch(e){valuesNote=sErr(e)}}
  if(!skills||!skills.length)skills=jdFallback(ck.jd);
  if(!sm&&typeof AssistCore!=="undefined"&&ck.values.trim().length>60){const vm=AssistCore.valuesMatch(rt,ck.values);values={score:vm.score==null?0:vm.score,matched:vm.shown.concat(vm.thin).map(v=>({value:v,evidence:"Your resume uses related words. This is a rule-based estimate."})),gaps:vm.no_evidence}}else if(sm&&ck.values.trim().length>60){try{values=await sm.json('Score how well this person\'s resume evidence matches the employer\'s stated values. Use ONLY the values text and the resume text. Return JSON {"score":number 0-100,"matched":[{"value":string,"evidence":string (a short quote or paraphrase from the resume)}],"gaps":string[]}. Be strict: no evidence means a gap. Do not invent evidence.\n\nVALUES:\n'+ck.values.slice(0,6000)+'\n\nRESUME:\n'+rt.slice(0,20000),{cache:false,modelTier:"default"});values.score=Math.max(0,Math.min(100,Math.round(+values.score||0)))}catch(e){valuesNote=sErr(e)}}
  else if(!ck.values.trim())valuesNote="Paste the employer's values text to get a values match.";
  ck.res={ats:atsScore(rt),skills:skillsScore(skills,rt),elig:eligibility(ck.jd,pr,pr.yrs),values,valuesNote};ck.busy=false;check()}}
function ach(){const c=counts(),applied=c.Applied+c.Interview+c.Offer+c.Rejected,grad=apps.filter(a=>(a.route==="Graduate program"||a.route==="Graduate role"||a.tier==="Tier 1")&&["Applied","Interview","Offer","Rejected"].includes(a.status)).length,done=Object.values(prefs.learn).filter(v=>v==="Completed"||v==="Done").length,enrolled=Object.values(prefs.learn).filter(v=>["Enrolled","In progress","Completed","Watching","Done"].includes(v)).length,pins=Object.values(prefs.pins).filter(Boolean).length+apps.filter(a=>a.pinned).length,mine=prefs.custom.length;
 const B=[["First application","Applied to 1 role",applied>=1,applied,1],["Ten down","Applied to 10 roles",applied>=10,applied,10],["Twenty-five","Applied to 25 roles",applied>=25,applied,25],["Graduate track","Applied to 3 graduate roles",grad>=3,grad,3],["First interview","An interview is booked",c.Interview>=1,c.Interview,1],["Offer in hand","Received an offer",c.Offer>=1,c.Offer,1],["Learner","Completed 2 free courses or videos",done>=2,done,2],["Started learning","Enrol in or watch something free",enrolled>=1,enrolled,1],["Organised","Tracking 30+ roles",apps.length>=30,apps.length,30],["Source scout","Add 3 portals of your own",mine>=3,mine,3],["Curator","Pin 3 favourites",pins>=3,pins,3],["Loose ends tied","No role past its deadline without an answer",apps.length>0&&apps.filter(a=>pastDue(a)||a.status==="Needs Review").length===0,apps.length>0&&apps.filter(a=>pastDue(a)||a.status==="Needs Review").length===0?1:0,1]];
 $("#main").innerHTML=`<h2>Achievements</h2><p class="sub">Counts come straight from your tracker and your own choices here.</p><div class="stats"><div class="stat"><b>${apps.length}</b><span>Tracked</span></div><div class="stat"><b>${applied}</b><span>Applied</span></div><div class="stat"><b>${c.Interview}</b><span>Interviews</span></div><div class="stat"><b>${c.Offer}</b><span>Offers</span></div><div class="stat"><b>${c.Rejected}</b><span>Not successful</span></div><div class="stat"><b>${enrolled}</b><span>Learning started</span></div></div>
 <div class="grid">${B.map(b=>`<div class="card badge ${b[2]?"on":"off"}" style="flex-direction:row"><div class="ring">${b[2]?"✓":Math.min(b[3],b[4])+"/"+b[4]}</div><div><h3>${b[0]}</h3><small style="color:var(--muted)">${b[1]}</small></div></div>`).join("")}</div>`}
function reply(){$("#main").innerHTML=`<h2>Reply guide</h2><p class="sub">Reply to any preview or status email from your own addresses. Start with a label, or write in your own words after CHANGE. Tap Copy, then paste it into your reply and put the real Role ID in.</p>
 <div class="tw"><table class="t2"><thead><tr><th>Write</th><th>What happens</th><th></th></tr></thead><tbody>${REPLIES.map((r,i)=>`<tr><td class="id">${esc(r[0])}</td><td>${esc(r[1])}</td><td><button class="ghost sm" data-cp="${i}">Copy</button></td></tr>`).join("")}</tbody></table></div>
 <p class="sub" style="margin-top:12px">Every reply gets an answer that says exactly what I understood and what changed. Silence is never approval. A bare "yes", anything with "if", "but" or a question mark, or anything that mentions both approve and skip is not acted on: I ask first. Only email from your own addresses counts as an instruction.</p>`;
 document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copyText(REPLIES[+b.dataset.cp][0].split(" / ")[0]))}
function settings(){const c=prefs.consent;$("#main").innerHTML=`<h2>Privacy and consent</h2><p class="sub">This project and everything in it belongs to Madhumitha Challa. Her data is private to her account. Anyone else who uses a copy of these tools starts with an empty profile, sees only their own data, and chooses below what the tools may use. The automation reads these switches before it touches anything.</p>
 <div class="cons">${CONSENTS.map(x=>`<label><input type="checkbox" data-c="${x[0]}" ${c[x[0]]?"checked":""}><span><b>${x[1]}</b><br><small style="color:var(--muted)">${x[2]}</small></span></label>`).join("")}</div>
 <div class="note" style="margin-top:12px">Sign-in to job sites and Google happens on those sites, in your own browser. No passwords or codes are stored here.</div><p class="sub">© 2026 Madhumitha Challa. All rights reserved.</p>`;

(async()=>{try{try{dls=await claude.use("downloads")}catch(e){}db=await getDb();if(!db)return;
